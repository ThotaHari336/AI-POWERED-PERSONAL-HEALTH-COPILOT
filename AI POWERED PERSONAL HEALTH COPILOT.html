nction goTo(i){\n  var cur=Math.round(-theta/STEP),k=((i-cur)%N+N)%N;if(k>N/2)k-=N;\n  target=(-(cur+k))*STEP;kick();\n}\ndocument.getElementById('prev').onclick=function(){target=Math.round(target/STEP)*STEP+STEP;kick()};\ndocument.getElementById('next').onclick=function(){target=Math.round(target/STEP)*STEP-STEP;kick()};\naddEventListener('keydown',function(e){\n  if(e.key==='ArrowLeft')document.getElementById('prev').click();\n  if(e.key==='ArrowRight')document.getElementById('next').click();\n});\nvar sx=0,st=0,lx=0,lt=0;\nstage.addEventListener('pointerdown',function(e){\n  drag=true;moved=false;sx=lx=e.clientX;st=theta;vel=0;lt=performance.now();\n  stage.classList.add('grab');kick();\n});\naddEventListener('pointermove',function(e){\n  if(!drag)return;\n  var dx=e.clientX-sx;if(Math.abs(dx)>5)moved=true;\n  if(!moved)return;\n  theta=st+dx*0.4;\n  var now=performance.now(),dt=Math.max(now-lt,1);\n  vel=vel*0.7+((e.clientX-lx)*0.4/dt*16)*0.3;lx=e.clientX;lt=now;\n  render();\n});\naddEventListener('pointerup',function(){\n  if(!drag)return;drag=false;stage.classList.remove('grab');\n  snap(moved?vel*10:0);\n  setTimeout(function(){moved=false},0);\n});\naddEventListener('resize',layout);\ndocument.getElementById('cta').addEventListener('click',function(e){e.preventDefault();SPA.go('profile')});\nlayout();\n", "ex": ["goTo", "kick", "layout", "loop", "render", "snap"]}, "profile": {"css": "\n:root{--bg:#f3f8f7;--cd:#fff;--tx:#12302f;--mu:#556f6d;--ac:#0f766e;--on:#fff;--bd:#d3e2e0;--er:#b42318;--ok:#067647;--wn:#b54708;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1a1a;--cd:#142525;--tx:#e6f2f1;--mu:#9bb5b3;--ac:#2dd4bf;--on:#062b28;--bd:#2a4242;--er:#f97066;--ok:#47cd89;--wn:#fdb022}}\n*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1 \n      star: '<svg viewBox=\"0 0 24 24\"><polygon class=\"st\" points=\"12,3 14.8,9 21,9.7 16.4,14 17.7,20.5 12,17.3 6.3,20.5 7.6,14 3,9.7 9.2,9\"/><\/svg>' };\n    const pv = (ic, h, t, d) => `<div class=\"float\" style=\"--d:${d}s\"><article class=\"dcard glass tilt\"><span class=\"big-ic\">${ic}<\/span><h3>${h}<\/h3><p>${t}<\/p><\/article><\/div>`;\n    return `<section class=\"hero glass\"><div><span class=\"pill\">&#129504; AI Copilot &middot; Lakeview Health Network<\/span>\n      <h1 class=\"big\">Your AI-Powered Personal Health Copilot<\/h1>\n      <p class=\"lead\">Upload your medical records, prescriptions &amp; lab reports. Get meaningful, actionable insights instantly.<\/p>\n      <div class=\"cta\"><button data-a=\"go\" data-i=\"vault\">Upload &amp; Analyze<\/button><a class=\"learn\" href=\"#learn\">Learn More &rarr;<\/a><\/div>\n      <div class=\"trust\">${badge(ico.pat, '10K+', 'Patients')}${badge(ico.doc, '25+', 'Specialists')}${badge(ico.star, '4.9', 'Rating')}<\/div><\/div>\n      <div class=\"stack\">${pv('&#129504;', 'AI analysis', esc(top[0] ? top[0].t : 'Upload a report to see your insights'), 0)}${pv('&#128202;', 'Insights', top.length + ' thing' + (top.length === 1 ? '' : 's') + ' to check', 0.5)}${pv('&#128172;', 'Copilot chat', 'Ask about symptoms, results and medicines', 1)}<\/div><\/section>\n      ${demoBar()}<h2>&#128202; Your health timeline &rarr; AI insights &rarr; what to do next<\/h2>${insightFlow(true)}\n      <h2>Our specialists on duty<\/h2><div class=\"dgrid\">${on.map(dcard).join('') || '<p class=\"sub\">No doctors on duty at this branch right now.<\/p>'}<\/div>\n      <h2>Find us &amp; opening hours<\/h2>${mapCard()}\n      <h2 id=\"learn\">Why Lakeview Health Copilot<\/h2><div class=\"grid\">${[['&#129504; AI Health Vault', 'Upload records, prescriptions and lab reports. Get a plain-language summary and next steps.'], ['&#128202; Actionable insights', 'Your timeline, what the AI noticed, and exactly what to do next.'],\n        ['&#128172; Copilot chat', 'Ask about symptoms, results or missed doses, any time.'], ['&#127973; Real care behind it', 'Book specialists, labs, pharmacy and emergency care across three branches.']].map(([t, d]) => `<div class=\"why glass\"><b>${t}<\/b><span class=\"sub\" style=\"margin:0\">${d}<\/span><\/div>`).join('')}<\/div>`;\n  },\n  appointments() {\n    const on = mine(S.doctors).filter(d => d.on);\n    return head('Appointments', 'Book with doctors on duty') + (on.length ? `<form data-f=\"appt\"><input name=\"p\" placeholder=\"Patient name\" required>\n      <select name=\"d\">${on.map(d => `<option>${esc(d.n)} (${d.s})<\/option>`).join('')}<\/select><input type=\"datetime-local\" name=\"when\" required><button>Book appointment<\/button><\/form>` : '<p class=\"alert\">No doctors on duty at this branch.<\/p>') +\n      tbl(['Patient', 'Doctor', 'When', 'Status', ''], mine(S.appts).map(a => [esc(a.p), esc(a.d), esc(a.when.replace('T', ' ')), a.st, a.st === 'Booked' ? `<button class=\"danger\" data-a=\"cancel\" data-i=\"${a.i}\">Cancel<\/button>` : '']));\n  },\n  doctors() {\n    const sp = [...new Set(mine(S.doctors).map(d => d.s))].sort();\n    return head('Specialised doctors', 'Add, search, filter and manage duty') + docForm() + `<div class=\"bar\">${srch('doctors', 'Search doctor name or specialty')}\n      <select data-q=\"dsp\" aria-label=\"Specialty\"><option value=\"\">All specialties<\/option>${sp.map(x => `<option ${Q.dsp === x ? 'selected' : ''}>${x}<\/option>`).join('')}<\/select>\n      <select data-q=\"dst\" aria-label=\"Duty status\">${[['', 'All status'], ['on', 'On duty'], ['off', 'Off duty']].map(([v, t]) => `<option value=\"${v}\" ${Q.dst === v ? 'selected' : ''}>${t}<\/option>`).join('')}<\/select><\/div>\n      <div id=\"list\" data-l=\"doctors\">${L.doctors()}<\/div>`;\n  },\n  symptoms() {\n    const chips = ['Fever', 'Cough', 'Headache', 'Sore throat', 'Body pain', 'Runny nose', 'Chest pain', 'Shortness of breath', 'Palpitations', 'Nausea', 'Vomiting',\n      'Diarrhea', 'Stomach pain', 'Rash', 'Itching', 'Joint pain', 'Back pain', 'Dizziness', 'Fatigue', 'Frequent urination'];\n    return head('Symptom checker', 'Tell us your symptoms to see possible causes') +\n      `<input data-s=\"1\" value=\"${esc(SYMTXT)}\" placeholder=\"Type symptoms, e.g. fever, headache, body pain\" aria-label=\"Your symptoms\" size=\"48\">\n      <button class=\"ghost\" data-chip=\"__clear\">Clear<\/button>\n      <div class=\"chk\">${chips.map(c => `<button class=\"ghost\" data-chip=\"${c.toLowerCase()}\">+ ${c}<\/button>`).join('')}<\/div>\n      <div id=\"symOut\">${symResult()}<\/div>\n      <p class=\"note\">This tool gives general guidance only, not a diagnosis. Please see a doctor, and use Emergency for severe symptoms.<\/p>`;\n  },\n  lab() {\n    const m = mine(S.labs), c = x => m.filter(l => l.st === x).length;\n    return head('Lab reports', 'Order tests, track samples and view results') + `<div class=\"grid\" style=\"margin-bottom:14px\">${[['Ordered', 'Awaiting sample'], ['Sample collected', 'In processing'], ['Result ready', 'Reports ready']].map(([x, t]) => `<div class=\"card stat\"><b>${c(x)}<\/b><span>${t}<\/span><\/div>`).join('')}\n      <div class=\"card stat\"><b>${m.filter(l => l.pri === 'Urgent' && l.st !== 'Result ready').length}<\/b><span>Urgent pending<\/span><\/div><\/div>\n      <form data-f=\"lab\"><input name=\"p\" placeholder=\"Patient name\" required><select name=\"t\">${LABTESTS.map(t => `<option value=\"${t[0]}\">${t[0]} - Rs. ${t[1]} (${t[2]})<\/option>`).join('')}<\/select>\n      <select name=\"pri\"><option>Routine<\/option><option>Urgent<\/option><\/select><button>Order test<\/button><\/form>\n      <div class=\"bar\">${srch('lab', 'Search patient, test or order ID')}<select data-q=\"lst\" aria-label=\"Status\">${['', 'Ordered', 'Sample collected', 'Result ready'].map(x => `<option value=\"${x}\" ${Q.lst === x ? 'selected' : ''}>${x || 'All status'}<\/option>`).join('')}<\/select><\/div>\n      <div id=\"list\" data-l=\"lab\">${L.lab()}<\/div>`;\n  },\n  location() {\n    const l = S.loc[br];\n    return head('Hospital location', 'Live map and opening hours') + mapCard() + `<h3>Update this branch<\/h3><form data-f=\"loc\"><input name=\"addr\" value=\"${esc(l.addr)}\" size=\"40\" required placeholder=\"Full address\">\n      <input name=\"phone\" value=\"${esc(l.phone)}\" placeholder=\"Phone with country code\"><input name=\"openH\" type=\"number\" min=\"0\" max=\"23\" value=\"${l.openH}\" title=\"OPD opens (hour, 0-23)\" style=\"width:90px\">\n      <input name=\"closeH\" type=\"number\" min=\"1\" max=\"24\" value=\"${l.closeH}\" title=\"OPD closes (hour, 1-24)\" style=\"width:90px\"><button>Save<\/button><\/form>\n      <p class=\"note\">Hours use the 24-hour clock (8 = 8 AM, 21 = 9 PM). The addresses and phone numbers here are samples. Enter your real ones, with country code, so the map, Call and WhatsApp buttons work.<\/p>`;\n  },\n  pharmacy() {\n    return head('Pharmacy', 'Add, search, filter and manage stock') + (low().length ? `<div class=\"alert\"><b>${low().length} item(s) below minimum:<\/b> ${low().map(x => esc(x.n)).join(', ')}<\/div>` : '') +\n      medForm() + `<div class=\"bar\">${srch('pharmacy', 'Search medicine name')}\n      <select data-q=\"pst\" aria-label=\"Stock filter\">${[['', 'All items'], ['low', 'Low stock only'], ['ok', 'In stock (OK)']].map(([v, t]) => `<option value=\"${v}\" ${Q.pst === v ? 'selected' : ''}>${t}<\/option>`).join('')}<\/select>\n      <select data-q=\"psort\" aria-label=\"Sort\">${[['', 'Sort: A to Z'], ['qty', 'Sort: lowest stock first']].map(([v, t]) => `<option value=\"${v}\" ${Q.psort === v ? 'selected' : ''}>${t}<\/option>`).join('')}<\/select><\/div>\n      <div id=\"list\" data-l=\"pharmacy\">${L.pharmacy()}<\/div>`;\n  },\n  blood() {\n    return head('Blood bank', 'Units available') + `<div class=\"grid\">${GROUPS.map(g => { const u = S.blood[br][g]; return `<div class=\"card\"><div class=\"bag ${u < 5 ? 'bad' : ''}\">${g}<\/div><p>${u} units ${u < 5 ? '<span class=\"tag bad\">Low<\/span>' : ''}<\/p>\n      <button class=\"ghost\" data-a=\"issue\" data-i=\"${g}\">Issue 1<\/button> <button data-a=\"donate\" data-i=\"${g}\">Add donation<\/button><\/div>`; }).join('')}<\/div>`;\n  },\n  billing() {\n    const b = mine(S.bills);\n    return head('Billing', 'Invoices and payments') + `<form data-f=\"bill\"><input name=\"p\" placeholder=\"Patient name\" required><input name=\"d\" placeholder=\"Description\" required><input name=\"amt\" type=\"number\" min=\"1\" placeholder=\"Amount (Rs.)\" required><button>Create bill<\/button><\/form>` +\n      tbl(['Patient', 'Description', 'Amount', 'Status', ''], b.map(x => [esc(x.p), esc(x.d), 'Rs. ' + x.amt, `<span class=\"tag ${x.paid ? 'ok' : 'warn'}\">${x.paid ? 'Paid' : 'Unpaid'}<\/span>`, x.paid ? '' : `<button data-a=\"pay\" data-i=\"${x.i}\">Mark paid<\/button>`])) +\n      `<p class=\"note\">Outstanding: Rs. ${b.filter(x => !x.paid).reduce((s, x) => s + x.amt, 0)}<\/p>`;\n  },\n  nurses() {\n    const m = mine(S.nurses), c = x => m.filter(n => n.sh === x).length;\n    return head('Nurse shifts', 'Add nurses, search and assign shifts') + `<div class=\"grid\" style=\"margin-bottom:14px\">${['Morning', 'Evening', 'Night'].map(x => `<div class=\"card stat\"><b>${c(x)}<\/b><span>${x} shift<\/span><\/div>`).join('')}<\/div>` + nurseForm() +\n      `<div class=\"bar\">${srch('nurses', 'Search nurse name')}<select data-q=\"nsh\" aria-label=\"Shift filter\">${['', 'Morning', 'Evening', 'Night'].map(x => `<option value=\"${x}\" ${Q.nsh === x ? 'selected' : ''}>${x || 'All shifts'}<\/option>`).join('')}<\/select><\/div>\n      <div id=\"list\" data-l=\"nurses\">${L.nurses()}<\/div>`;\n  },\n  medication() {\n    return head('Medication round', 'Add medications, mark doses as given') + `<form data-f=\"round\"><input name=\"p\" placeholder=\"Patient (e.g. Ravi S. (Bed 4))\" required><input name=\"d\" placeholder=\"Medicine and dose\" required><input name=\"due\" type=\"time\" value=\"08:00\" required aria-label=\"Due time\"><button>+ Add medication<\/button><\/form>` + srch('medication', 'Search patient or medicine') + `<div id=\"list\" data-l=\"medication\">${L.medication()}<\/div>`;\n  },\n  ambulance() {\n    return head('Ambulance', 'Dispatch and return') + tbl(['Vehicle', 'Status', 'Destination', ''], mine(S.amb).map(a => [a.id,\n      `<span class=\"tag ${a.st === 'Available' ? 'ok' : 'warn'}\">${a.st}<\/span>`, esc(a.dest) || '-',\n      a.st === 'Available' ? `<button data-a=\"dispatch\" data-i=\"${a.i}\">Dispatch<\/button>` : `<button class=\"ghost\" data-a=\"ret\" data-i=\"${a.i}\">Mark returned<\/button>`]));\n  },\n  security() {\n    return head('Security event log', 'Newest first') + `<form data-f=\"sec\"><input name=\"m\" placeholder=\"Describe the event\" required size=\"36\"><button>Log event<\/button><\/form>` +\n      tbl(['Time', 'Event'], mine(S.sec).map(e => [e.t, esc(e.m)]));\n  },\n  emergency() {\n    return head('Emergency', 'Register and triage arrivals') + `<form data-f=\"er\"><input name=\"p\" placeholder=\"Patient / description\" required>\n      <select name=\"sev\"><option>Critical<\/option><option>Serious<\/option><option>Moderate<\/option><\/select><button class=\"danger\">Register emergency<\/button><\/form>` +\n      tbl(['Time', 'Patient', 'Severity', 'Status', ''], mine(S.er).map(e => [e.t, esc(e.p), `<span class=\"tag ${e.sev === 'Critical' ? 'bad' : 'warn'}\">${e.sev}<\/span>`, e.st,\n        e.st === 'Active' ? `<button class=\"ghost\" data-a=\"resolve\" data-i=\"${e.i}\">Resolve<\/button>` : '']));\n  },\n  icu() {\n    return head('ICU', 'Bed board') + `<div class=\"grid\">${mine(S.icu).map(b => `<div class=\"card bed ${b.p ? 'full' : ''}\"><h3>${b.id}<\/h3><p>${b.p ? esc(b.p) : '<span class=\"ok\">Free<\/span>'}<\/p>\n      ${b.p ? `<button class=\"ghost\" data-a=\"disch\" data-i=\"${b.i}\">Discharge<\/button>` : `<button data-a=\"admit\" data-i=\"${b.i}\">Admit<\/button>`}<\/div>`).join('')}<\/div>`;\n  }\n};\n/* ---------- Search + symptom helpers ---------- */\nconst SPECS = ['Cardiology', 'Neurology', 'Orthopedics', 'Pediatrics', 'Gastroenterology', 'Pulmonology', 'Dermatology', 'General Medicine', 'Gynecology', 'ENT', 'Ophthalmology', 'Psychiatry'];\nconst ini = n => n.replace(/^dr\\.?\\s*/i, '').split(/\\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();\nconst docForm = () => `<form data-f=\"doc\"><input name=\"n\" placeholder=\"Doctor name\" required><input name=\"s\" list=\"specs\" placeholder=\"Specialty\" required>\n  <datalist id=\"specs\">${SPECS.map(x => `<option value=\"${x}\">`).join('')}<\/datalist><button>Add doctor<\/button><\/form>`;\nconst medForm = () => `<form data-f=\"med\"><input name=\"n\" placeholder=\"Medicine name\" required><input name=\"q\" type=\"number\" min=\"0\" placeholder=\"Quantity\" required>\n  <input name=\"min\" type=\"number\" min=\"1\" placeholder=\"Minimum stock\" required><button>Add medicine<\/button><\/form>`;\nconst LABTESTS = [['CBC', 350, '4 hrs'], ['Lipid profile', 600, '6 hrs'], ['HbA1c', 500, '6 hrs'], ['Liver function', 700, '8 hrs'], ['Chest X-ray', 400, '1 hr'],\n  ['Fasting blood sugar', 100, '2 hrs'], ['Thyroid (TSH)', 450, '8 hrs'], ['Dengue NS1', 900, '4 hrs'], ['Urine routine', 150, '2 hrs']];\nfunction show(html) { const d = document.createElement('dialog'); d.innerHTML = `<form method=\"dialog\">${html}<div><button>Close<\/button><\/div><\/form>`;\n  document.body.appendChild(d); d.addEventListener('close', () => d.remove()); d.showModal(); }\nconst Q = { lab: '', lst: '', doctors: '', dsp: '', dst: '', nurses: '', nsh: '', medication: '', mymed: '', pharmacy: '', pst: '', psort: '' };\nconst nurseForm = () => `<form data-f=\"nurse\"><input name=\"n\" placeholder=\"Nurse name\" required><select name=\"sh\"><option>Morning<\/option><option>Evening<\/option><option>Night<\/option><\/select><button>Add nurse<\/button><\/form>`;\nfunction ask(q) { return new Promise(res => { const d = document.createElement('dialog');\n  d.innerHTML = `<form method=\"dialog\"><p>${esc(q)}<\/p><input required autofocus><div><button value=\"ok\">OK<\/button> <button value=\"x\" class=\"ghost\" formnovalidate>Cancel<\/button><\/div><\/form>`;\n  document.body.appendChild(d); d.addEventListener('close', () => { res(d.returnValue === 'ok' ? d.querySelector('input').value.trim() : null); d.remove(); }); d.showModal(); }); }\nlet SYMTXT = '';\nconst srch = (k, ph) => `<input type=\"search\" data-q=\"${k}\" placeholder=\"${ph}\" aria-label=\"${ph}\" value=\"${esc(Q[k])}\" size=\"34\" style=\"margin-bottom:4px\">`;\nconst hit = (q, ...f) => !q.trim() || f.join(' ').toLowerCase().includes(q.trim().toLowerCase());\nconst L = {\n  lab: () => { const all = mine(S.labs), id = l => 'LAB-' + (101 + l.i);\n    const r = all.filter(l => hit(Q.lab, l.p, l.t, id(l)) && (!Q.lst || l.st === Q.lst)).reverse();\n    return `<p class=\"note\">Showing ${r.length} of ${all.length} orders<\/p>` + tbl(['ID', 'Patient', 'Test', 'Priority', 'Ordered', 'Status', 'Result centre', ''], r.map(l => [id(l), esc(l.p), l.t,\n      `<span class=\"tag ${l.pri === 'Urgent' ? 'bad' : ''}\">${l.pri}<\/span>`, l.at, `<span class=\"tag ${l.st === 'Result ready' ? 'ok' : 'warn'}\">${l.st}<\/span>`,\n      l.st === 'Result ready' ? `<b class=\"${l.flag === 'Abnormal' ? 'bad' : 'ok'}\">${l.flag}<\/b>: ${esc(l.res)}` : '-',\n      l.st === 'Ordered' ? `<button class=\"ghost\" data-a=\"sample\" data-i=\"${l.i}\">Collect sample<\/button>` : l.st === 'Sample collected' ? `<button data-a=\"result\" data-i=\"${l.i}\">Post result<\/button>`\n        : `<button class=\"ghost\" data-a=\"report\" data-i=\"${l.i}\">View report<\/button> <button class=\"ghost\" data-a=\"flag\" data-i=\"${l.i}\">Flag<\/button>`])); },\n  pharmacy: () => { const all = mine(S.pharm);\n    let r = all.filter(x => hit(Q.pharmacy, x.n) && (!Q.pst || (Q.pst === 'low') === (x.q < x.min)));\n    r = Q.psort === 'qty' ? r.sort((a, b) => a.q - b.q) : r.sort((a, b) => a.n.localeCompare(b.n));\n    return `<p class=\"note\">Showing ${r.length} of ${all.length} medicines &middot; ${low().length} low stock<\/p>` + tbl(['Medicine', 'In stock', 'Level', 'Minimum', 'Status', ''], r.map(x => [esc(x.n), x.q,\n      `<div class=\"meter\"><i class=\"${x.q < x.min ? 'lo' : ''}\" style=\"width:${Math.min(100, Math.round(x.q / (x.min * 2) * 100))}%\"><\/i><\/div>`, x.min,\n      `<span class=\"tag ${x.q < x.min ? 'bad' : 'ok'}\">${x.q < x.min ? 'Low stock' : 'OK'}<\/span>`,\n      `<button class=\"ghost\" data-a=\"disp\" data-i=\"${x.i}\">Dispense<\/button> <button data-a=\"restock\" data-i=\"${x.i}\">Restock<\/button> <button class=\"danger\" data-a=\"delmed\" data-i=\"${x.i}\">Remove<\/button>`])); },\n  doctors: () => { const all = mine(S.doctors);\n    const r = all.filter(d => hit(Q.doctors, d.n, d.s) && (!Q.dsp || d.s === Q.dsp) && (!Q.dst || (Q.dst === 'on') === d.on));\n    return `<p class=\"note\">Showing ${r.length} of ${all.length} doctors<\/p>` + tbl(['Doctor', 'Specialty', 'Status', ''], r.map(d =>\n      [`<span class=\"av\">${ini(d.n)}<\/span> ${esc(d.n)}`, d.s, `<span class=\"tag ${d.on ? 'ok' : 'bad'}\">${d.on ? 'On duty' : 'Off duty'}<\/span>`,\n       `<button class=\"ghost\" data-a=\"duty\" data-i=\"${d.i}\">${d.on ? 'Go off duty' : 'Go on duty'}<\/button> <button class=\"danger\" data-a=\"deldoc\" data-i=\"${d.i}\">Remove<\/button>`])); },\n  nurses: () => { const all = mine(S.nurses);\n    const r = all.filter(n => hit(Q.nurses, n.n, n.sh) && (!Q.nsh || n.sh === Q.nsh));\n    return `<p class=\"note\">Showing ${r.length} of ${all.length} nurses<\/p>` + tbl(['Nurse', 'Shift', ''], r.map(n => [esc(n.n),\n      `<select data-c=\"shift\" data-i=\"${n.i}\">${['Morning', 'Evening', 'Night'].map(x => `<option ${x === n.sh ? 'selected' : ''}>${x}<\/option>`).join('')}<\/select>`,\n      `<button class=\"danger\" data-a=\"delnurse\" data-i=\"${n.i}\"
